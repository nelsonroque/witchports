[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "witchport"
version = "0.1.0"
description = "Find and stop local listening processes from your terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=3,<9"]

[project.scripts]
witchport = "witchport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
